<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		body {
			margin: 0px;
			padding: 0px;
		}
		div.container {
			height: 800px;
			background-color: rgba(24, 12, 66); background-attachment: fixed;
			display: flex; flex-direction: row; justify-content: space-around; align-items: center;
			overflow-x: scroll;
			}
		div.title {
			flex-shrink: 0;
			display: flex; 
			align-items: center;
			color: white;
			width: 380px;
			margin: 0px 100px;
		}
		div.phone {
			flex-shrink: 0; 
			display: inline-block;
			display: flex; 
			flex-direction: column;
			justify-content: space-between;
			border: 20px solid black; 
			width: 400px; height: 600px; 
			border-radius: 20px;
			background-color: transparent; background-image: url('bg.jpg');background-repeat: no-repeat; background-size: cover; background-position: center center;}
		div.screen{
			width: 100%; height: 500px;
			padding: 0px;
			overflow-y: hidden;
			overflow-x: hidden;

		}
		div.message {
			background-color: rgb(204 194 194); 
			border-radius: 10px; 
			width: 80%;
			height: 80px;
			margin: 30px auto 0; 
			color: black; 
			display: flex;
			align-items: center;
		}
		div.message-image{
			display: inline-block;
			height: 35px;
		}
		div.message-image img{
			display: inline-block;
			width: 35px; height: 35px; 
			border-radius: 15px;
			margin: 0px 15px; 
		}
		div.message-content{
			display: inline-block;
			text-align: left;
		}
		div.message-content p.title{
			font-size: 12px; font-weight: bold;
			margin: 0px;
		}
		div.message-content p.content{
			font-size: 10px; font-weight: bold;
			margin: 0px;
			margin-right: 15px;
		}
		div.app {
			display: flex;
			justify-content: space-around;
		}
		a {
			display: inline-block; 
			width: 50px; height: 50px; 
			background-size: cover; 
			border-radius: 15px; 
			margin-top: 25vh; }
		a.call { background-image: url("call.jpg");  }
		a.news { background-image: url("news.png");  }
		a.insta { background-image: url("insta.jpg");  }
		a.x { background-image: url("x.png");  }
		div.lowpart {
			background-color: black; 
			width: 100%; height: 40px ; 
			text-align: center;}
		a.home {display: inline-block;width: 30px; height: 30px; border: 2px solid white; border-radius: 50%;background-color: black; margin: 0 auto}


	</style>
</head>
<body>
	<div class = "container">
		<div class = "title">
			<h1>Should SNS be banned?</h1>
		</div>
		<div class = "phone">
			<div class="screen">
				<div class = "message">
					<div class="message-image">
						<img src="news.png" alt='news icon'>
					</div>
					<div class="message-content">
						<p class="title">Breaking News!!</p>
						<p class="content">The Australian federal government said Tuesday that it will introduce legislation this year that bans children from accessing social media.</p>
					</div>
				</div>
				<div class="app">
					<a class ="call" ></a>
					<a class ="news" href="page2.html"></a>
					<a class = "insta" href = "https://www.instagram.com"></a>
					<a class = "x" href = "https://www.x.com"></a>
				</div>
			</div>
			<div class="lowpart">
				<a class = "home" ></a>
			</div>
		</div>
	</div>
</body>
</html>
